  TKR_003: "批量入仓_新增任务_发布状态判断"
  TKR_004: "批量入仓_新增任务_校验失败规则"
  TKR_005: "批量入仓_新增任务_取消上传规则"
  TKR_006: "批量入仓_新增任务_审批拒绝规则"
  TKR_007: "批量入仓_新增任务_入仓任务发布成功判断"


